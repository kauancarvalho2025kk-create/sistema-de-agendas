<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil - Reserva Escolar</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<nav class="navbar">

    <div class="brand">
        📚 Reserva Escolar
    </div>

    <div class="nav-links">

        <a href="home.html">
            Início
        </a>

        <a href="reservas.html">
            Agenda
        </a>

        <a href="historico.html">
            Histórico
        </a>

    </div>

    <div class="user-area">

        <div class="theme-selector">

            <button
                class="theme-button"
                onclick="abrirTemas()"
            >
                🎨 Tema
            </button>

            <div
                id="themeMenu"
                class="theme-menu hidden"
            >

                <button
                    onclick="escolherTema('light')"
                >
                    ☀️ Tema Claro
                </button>

                <button
                    onclick="escolherTema('dark')"
                >
                    🌙 Tema Escuro
                </button>

            </div>

        </div>

        <button
            class="logout"
            onclick="sair()"
        >
            Sair
        </button>

    </div>

</nav>


<main class="main">

    <div class="welcome">

        <h1>
            👤 Meu Perfil
        </h1>

        <p>
            Informações e estatísticas da sua conta.
        </p>

    </div>


    <section class="panel">

        <h2>
            Dados da conta
        </h2>

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Nick
                </label>

                <input
                    id="nick"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>
                    E-mail
                </label>

                <input
                    id="email"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>
                    Tipo de conta
                </label>

                <input
                    id="tipo"
                    readonly
                >

            </div>

        </div>

    </section>


    <section class="panel">

        <h2>
            📊 Estatísticas
        </h2>

        <div class="cards">

            <div class="card">

                <div class="card-icon">
                    📋
                </div>

                <div class="card-title">
                    Total de reservas
                </div>

                <div
                    class="card-number"
                    id="totalReservas"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="card-icon">
                    📽️
                </div>

                <div class="card-title">
                    Data Shows
                </div>

                <div
                    class="card-number"
                    id="totalDataShows"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="card-icon">
                    💻
                </div>

                <div class="card-title">
                    Sala
                </div>

                <div
                    class="card-number"
                    id="totalSala"
                >
                    0
                </div>

            </div>

        </div>

    </section>

</main>


<script src="app.js"></script>

<script>

const usuario =
    protegerPagina();


if (usuario) {

    document.getElementById(
        "nick"
    ).value =
        usuario.nick;


    document.getElementById(
        "email"
    ).value =
        usuario.email;


    document.getElementById(
        "tipo"
    ).value =
        usuario.role === "admin"
        ? "Administrador"
        : "Professor";


    const minhas =
        getReservas().filter(
            function(r) {

                return (
                    r.email ===
                    usuario.email
                );

            }
        );


    document.getElementById(
        "totalReservas"
    ).textContent =
        minhas.length;


    document.getElementById(
        "totalDataShows"
    ).textContent =
        minhas.filter(
            function(r) {

                return (
                    r.recurso ===
                    "Data Show"
                );

            }
        ).length;


    document.getElementById(
        "totalSala"
    ).textContent =
        minhas.filter(
            function(r) {

                return (
                    r.recurso ===
                    "Sala de Informática"
                );

            }
        ).length;

}

</script>

</body>

</html>
