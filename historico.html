<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Histórico - Reserva Escolar</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<nav class="navbar">

    <div class="brand">
        📚 Reserva Escolar
    </div>

    <div class="nav-links">

        <a href="home.html">
            Início
        </a>

        <a href="reservas.html">
            Agenda
        </a>

        <a href="historico.html">
            Histórico
        </a>

        <a href="perfil.html">
            Perfil
        </a>

    </div>

    <div class="user-area">

        <strong id="nomeUsuario"></strong>

        <div class="theme-selector">

            <button
                class="theme-button"
                onclick="abrirTemas()"
            >
                🎨 Tema
            </button>

            <div
                id="themeMenu"
                class="theme-menu hidden"
            >

                <button
                    onclick="escolherTema('light')"
                >
                    ☀️ Tema Claro
                </button>

                <button
                    onclick="escolherTema('dark')"
                >
                    🌙 Tema Escuro
                </button>

            </div>

        </div>

        <button
            class="logout"
            onclick="sair()"
        >
            Sair
        </button>

    </div>

</nav>


<main class="main">

    <div class="welcome">

        <h1>
            📜 Histórico de Reservas
        </h1>

        <p>
            Consulte e gerencie suas reservas.
        </p>

    </div>


    <section class="panel no-print">

        <div class="form-grid">

            <div class="form-group">

                <label for="filtroRecurso">
                    Filtrar recurso
                </label>

                <select id="filtroRecurso">

                    <option value="">
                        Todos
                    </option>

                    <option value="Data Show">
                        Data Show
                    </option>

                    <option value="Sala de Informática">
                        Sala de Informática
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="filtroData">
                    Filtrar data
                </label>

                <input
                    type="date"
                    id="filtroData"
                >

            </div>

        </div>


        <button
            class="button button-primary"
            style="margin-top:20px"
            onclick="carregarHistorico()"
        >
            🔎 Filtrar
        </button>


        <button
            class="button button-warning"
            style="margin-top:20px"
            onclick="limparFiltros()"
        >
            Limpar
        </button>


        <button
            class="button button-success"
            style="margin-top:20px"
            onclick="exportarCSV(reservasFiltradas())"
        >
            📥 Exportar CSV
        </button>


        <button
            class="button button-primary"
            style="margin-top:20px"
            onclick="imprimirPagina()"
        >
            🖨️ Imprimir
        </button>

    </section>


    <section class="panel">

        <div
            class="table-container"
            id="historico"
        ></div>

    </section>

</main>


<script src="app.js"></script>

<script>

const usuario =
    protegerPagina();


if (usuario) {

    document.getElementById(
        "nomeUsuario"
    ).textContent =
        usuario.nick;

    carregarHistorico();

}


function reservasFiltradas() {

    let reservas =
        getReservas().filter(
            function(r) {

                return (
                    r.email ===
                    usuario.email
                );

            }
        );


    const recurso =
        document.getElementById(
            "filtroRecurso"
        ).value;


    const data =
        document.getElementById(
            "filtroData"
        ).value;


    if (recurso) {

        reservas =
            reservas.filter(
                function(r) {

                    return (
                        r.recurso ===
                        recurso
                    );

                }
            );

    }


    if (data) {

        reservas =
            reservas.filter(
                function(r) {

                    return (
                        r.data ===
                        data
                    );

                }
            );

    }


    return reservas;

}


function carregarHistorico() {

    const reservas =
        reservasFiltradas();


    const area =
        document.getElementById(
            "historico"
        );


    if (
        reservas.length === 0
    ) {

        area.innerHTML =
            "<p>Nenhuma reserva encontrada.</p>";

        return;

    }


    area.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>
                        Recurso
                    </th>

                    <th>
                        Data
                    </th>

                    <th>
                        Horário
                    </th>

                    <th>
                        Ação
                    </th>

                </tr>

            </thead>

            <tbody>

                ${reservas.map(
                    function(r) {

                        return `

                            <tr>

                                <td>
                                    ${r.recurso}
                                </td>

                                <td>
                                    ${formatarData(r.data)}
                                </td>

                                <td>
                                    ${r.horario}
                                </td>

                                <td>

                                    <button
                                        class="button button-danger"
                                        onclick="cancelarMinhaReserva(${r.id})"
                                    >
                                        Cancelar
                                    </button>

                                </td>

                            </tr>

                        `;

                    }
                ).join("")}

            </tbody>

        </table>

    `;

}


function limparFiltros() {

    document.getElementById(
        "filtroRecurso"
    ).value = "";


    document.getElementById(
        "filtroData"
    ).value = "";


    carregarHistorico();

}

</script>

</body>

</html>
