<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agenda - Reserva Escolar</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<nav class="navbar">

    <div class="brand">
        📚 Reserva Escolar
    </div>

    <div class="nav-links">

        <a href="home.html">
            Início
        </a>

        <a href="reservas.html">
            Agenda
        </a>

        <a href="historico.html">
            Histórico
        </a>

        <a href="perfil.html">
            Perfil
        </a>

    </div>

    <div class="user-area">

        <strong id="nomeUsuario"></strong>

        <div class="theme-selector">

            <button
                class="theme-button"
                onclick="abrirTemas()"
            >
                🎨 Tema
            </button>

            <div
                id="themeMenu"
                class="theme-menu hidden"
            >

                <button
                    onclick="escolherTema('light')"
                >
                    ☀️ Tema Claro
                </button>

                <button
                    onclick="escolherTema('dark')"
                >
                    🌙 Tema Escuro
                </button>

            </div>

        </div>

        <button
            class="logout"
            onclick="sair()"
        >
            Sair
        </button>

    </div>

</nav>


<main class="main">

    <div class="welcome">

        <h1>
            📅 Agenda de Reservas
        </h1>

        <p>
            Consulte a disponibilidade e faça sua reserva.
        </p>

    </div>


    <section class="panel">

        <h2>
            📅 Escolha o dia
        </h2>

        <div
            class="date-buttons"
            id="dateButtons"
        ></div>

    </section>


    <section class="panel">

        <h2>
            📊 Disponibilidade
        </h2>

        <div
            class="table-container"
            id="agenda"
        ></div>

    </section>


    <section class="panel">

        <h2>
            ➕ Nova reserva
        </h2>

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Data
                </label>

                <input
                    id="dataSelecionada"
                    type="text"
                    readonly
                >

            </div>


            <div class="form-group">

                <label for="recurso">
                    Recurso
                </label>

                <select id="recurso">

                    <option value="">
                        Selecione
                    </option>

                    <option value="Data Show">
                        📽️ Data Show
                    </option>

                    <option value="Sala de Informática">
                        💻 Sala de Informática
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="horarioReserva">
                    Horário
                </label>

                <select id="horarioReserva">

                    <option value="">
                        Selecione
                    </option>

                </select>

            </div>

        </div>


        <button
            class="button button-primary"
            style="margin-top:20px"
            onclick="fazerReserva()"
        >
            📅 Fazer reserva
        </button>


        <button
            class="button button-warning"
            style="margin-top:20px"
            onclick="imprimirPagina()"
        >
            🖨️ Imprimir agenda
        </button>


        <button
            class="button button-success"
            style="margin-top:20px"
            onclick="exportarCSV(getReservasDoDia())"
        >
            📥 Exportar dia
        </button>

    </section>


    <section class="panel">

        <h2>
            📋 Minhas reservas para o dia
        </h2>

        <div
            class="table-container"
            id="minhasReservasDia"
        ></div>

    </section>

</main>


<script src="app.js"></script>

<script>

const usuario =
    protegerPagina();

if (usuario) {

    document.getElementById(
        "nomeUsuario"
    ).textContent =
        usuario.nick;

}


let dataSelecionada =
    getHoje();


const dataButtons =
    document.getElementById(
        "dateButtons"
    );


const dataInput =
    document.getElementById(
        "dataSelecionada"
    );


const agenda =
    document.getElementById(
        "agenda"
    );


const horarioSelect =
    document.getElementById(
        "horarioReserva"
    );


function criarBotoesData() {

    dataButtons.innerHTML = `

        <button
            class="date-button ${
                dataSelecionada === getHoje()
                ? "active"
                : ""
            }"
            onclick="selecionarData('${getHoje()}')"
        >

            📅 Hoje

            <br>

            <strong>
                ${formatarData(getHoje())}
            </strong>

        </button>


        <button
            class="date-button ${
                dataSelecionada === getAmanha()
                ? "active"
                : ""
            }"
            onclick="selecionarData('${getAmanha()}')"
        >

            📆 Amanhã

            <br>

            <strong>
                ${formatarData(getAmanha())}
            </strong>

        </button>

    `;

}


function selecionarData(data) {

    if (
        !dataPermitida(data)
    ) {

        mostrarToast(
            "Esta data não está disponível.",
            "warning"
        );

        return;
    }

    dataSelecionada =
        data;

    atualizarTudo();

}


function atualizarTudo() {

    criarBotoesData();

    dataInput.value =
        formatarData(
            dataSelecionada
        );

    carregarHorarios();

    atualizarAgenda();

    atualizarMinhasReservas();

}


function carregarHorarios() {

    horarioSelect.innerHTML = `

        <option value="">
            Selecione um horário
        </option>

    `;

    HORARIOS_RESERVA.forEach(
        function(horario) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                horario;

            option.textContent =
                horario;

            horarioSelect.appendChild(
                option
            );

        }
    );

}


function atualizarAgenda() {

    const data =
        dataSelecionada;

    const reservas =
        getReservas();

    let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        Horário
                    </th>

                    <th>
                        📽️ Data Show
                    </th>

                    <th>
                        💻 Sala
                    </th>

                    <th>
                        Situação
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    HORARIOS.forEach(
        function(horario) {

            if (
                INTERVALOS.includes(
                    horario
                )
            ) {

                html += `

                    <tr>

                        <td>
                            ${horario}
                        </td>

                        <td colspan="2">
                            ⏸️ INTERVALO
                        </td>

                        <td>

                            <span
                                class="status status-bloqueado"
                            >
                                BLOQUEADO
                            </span>

                        </td>

                    </tr>

                `;

                return;

            }


            const ds =
                reservas.filter(
                    function(r) {

                        return (
                            r.data === data &&
                            r.horario === horario &&
                            r.recurso === "Data Show"
                        );

                    }
                ).length;


            const sala =
                reservas.filter(
                    function(r) {

                        return (
                            r.data === data &&
                            r.horario === horario &&
                            r.recurso === "Sala de Informática"
                        );

                    }
                ).length;


            const status =
                statusDataShow(ds);


            html += `

                <tr>

                    <td>
                        ${horario}
                    </td>

                    <td>

                        <span
                            class="status ${status.classe}"
                        >
                            ${status.texto}
                        </span>

                    </td>

                    <td>

                        <span
                            class="status ${
                                sala >= 1
                                ? "status-cheio"
                                : "status-livre"
                            }"
                        >

                            ${
                                sala >= 1
                                ? "🔴 OCUPADA"
                                : "🟢 LIVRE"
                            }

                        </span>

                    </td>

                    <td>

                        ${
                            ds >= 5 &&
                            sala >= 1
                            ? "🔴 Horário cheio"
                            : "🟢 Há disponibilidade"
                        }

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    agenda.innerHTML =
        html;

}


function getReservasDoDia() {

    return getReservas().filter(
        function(r) {

            return (
                r.data ===
                dataSelecionada
            );

        }
    );

}


function atualizarMinhasReservas() {

    const minhas =
        getReservasDoDia().filter(
            function(r) {

                return (
                    r.email ===
                    usuario.email
                );

            }
        );


    const area =
        document.getElementById(
            "minhasReservasDia"
        );


    if (
        minhas.length === 0
    ) {

        area.innerHTML =
            "<p>Você não possui reservas para este dia.</p>";

        return;
    }


    area.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>
                        Recurso
                    </th>

                    <th>
                        Horário
                    </th>

                    <th>
                        Ação
                    </th>

                </tr>

            </thead>

            <tbody>

                ${minhas.map(
                    function(r) {

                        return `

                            <tr>

                                <td>
                                    ${r.recurso}
                                </td>

                                <td>
                                    ${r.horario}
                                </td>

                                <td>

                                    <button
                                        class="button button-danger"
                                        onclick="cancelarMinhaReserva(${r.id})"
                                    >
                                        Cancelar
                                    </button>

                                </td>

                            </tr>

                        `;

                    }
                ).join("")}

            </tbody>

        </table>

    `;

}


function fazerReserva() {

    const recurso =
        document.getElementById(
            "recurso"
        ).value;

    const horario =
        horarioSelect.value;


    if (
        !recurso ||
        !horario
    ) {

        mostrarToast(
            "Selecione o recurso e o horário.",
            "warning"
        );

        return;
    }


    if (
        !dataPermitida(
            dataSelecionada
        )
    ) {

        mostrarToast(
            "Só é possível reservar hoje ou amanhã.",
            "error"
        );

        return;
    }


    if (
        INTERVALOS.includes(
            horario
        )
    ) {

        mostrarToast(
            "Esse horário é intervalo e está bloqueado.",
            "error"
        );

        return;
    }


    const quantidade =
        contarReservas(
            dataSelecionada,
            horario,
            recurso
        );


    if (
        recurso === "Data Show" &&
        quantidade >= 5
    ) {

        mostrarToast(
            "Esse horário já possui 5 Data Shows.",
            "error"
        );

        return;
    }


    if (
        recurso === "Sala de Informática" &&
        quantidade >= 1
    ) {

        mostrarToast(
            "A Sala de Informática já está reservada nesse horário.",
            "error"
        );

        return;
    }


    const confirmar =
        confirm(
            `Confirmar reserva?\n\nRecurso: ${recurso}\nData: ${formatarData(dataSelecionada)}\nHorário: ${horario}`
        );


    if (!confirmar) {

        return;
    }


    const reservas =
        getReservas();


    reservas.push({

        id: Date.now(),

        data:
            dataSelecionada,

        horario:
            horario,

        recurso:
            recurso,

        nick:
            usuario.nick,

        email:
            usuario.email,

        criadoEm:
            new Date().toISOString()

    });


    salvarReservas(
        reservas
    );


    mostrarToast(
        "Reserva realizada com sucesso!",
        "success"
    );


    document.getElementById(
        "recurso"
    ).value = "";


    horarioSelect.value =
        "";


    atualizarTudo();

}


atualizarTudo();

</script>

</body>

</html>
