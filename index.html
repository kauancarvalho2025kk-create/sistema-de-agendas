<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserva Escolar - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-box">

            <div class="logo">

                <div class="logo-icon">
                    📚
                </div>

                <h1>Reserva Escolar</h1>

                <p>
                    Sistema de reservas escolares
                </p>

            </div>

            <!-- LOGIN -->

            <div id="loginArea">

                <h2>Bem-vindo!</h2>

                <p class="form-description">
                    Entre com sua conta para continuar.
                </p>

                <form id="formLogin">

                    <label for="loginEmail">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Digite seu e-mail"
                        required
                    >

                    <label for="loginSenha">
                        Senha
                    </label>

                    <div class="password-input">

                        <input
                            type="password"
                            id="loginSenha"
                            placeholder="Digite sua senha"
                            required
                        >

                        <button
                            type="button"
                            onclick="togglePassword('loginSenha', this)"
                        >
                            👁️
                        </button>

                    </div>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Entrar
                    </button>

                </form>

                <p class="switch-text">

                    Ainda não possui uma conta?

                    <button onclick="mostrarCadastro()">
                        Criar conta
                    </button>

                </p>

            </div>


            <!-- CADASTRO -->

            <div id="cadastroArea" class="hidden">

                <h2>Criar conta</h2>

                <p class="form-description">
                    Cadastre-se para realizar reservas.
                </p>

                <form id="formCadastro">

                    <label for="cadastroNick">
                        Nick
                    </label>

                    <input
                        type="text"
                        id="cadastroNick"
                        placeholder="Digite seu nick"
                        maxlength="30"
                        required
                    >

                    <label for="cadastroEmail">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="cadastroEmail"
                        placeholder="Digite seu e-mail"
                        required
                    >

                    <label for="cadastroSenha">
                        Senha
                    </label>

                    <div class="password-input">

                        <input
                            type="password"
                            id="cadastroSenha"
                            placeholder="Crie uma senha"
                            required
                        >

                        <button
                            type="button"
                            onclick="togglePassword('cadastroSenha', this)"
                        >
                            👁️
                        </button>

                    </div>

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Criar conta
                    </button>

                </form>

                <p class="switch-text">

                    Já possui uma conta?

                    <button onclick="mostrarLogin()">
                        Fazer login
                    </button>

                </p>

            </div>

            <div id="mensagem"></div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
